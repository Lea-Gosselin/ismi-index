[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fismi"
version = "0.1.0"
description = "Inflation Shock Momentum and Persistence"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "requests",
    "matplotlib",
    "pyarrow",
    "pyyaml",
    "openpyxl",
    "jupyter",
    "python-dotenv"
]

[tool.setuptools.packages.find]
include = ["fismi*"]
